name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  WCL_EDITOR_UI_SKIP: 1
  WCL_REV: e7d95a4c8191a28d53ffd8f63f67a2777aed1819
  VMLAB_REV: 9f0cf20ea6a851f632717756873b632ef852631f

jobs:
  check:
    name: Catalog, examples and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: taiki-e/install-action@just
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Cache validation tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wcl
            ~/.cargo/bin/vmlab
          key: template-ci-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-${{ env.WCL_REV }}-${{ env.VMLAB_REV }}

      - name: Install validation tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/wiltaylor/wcl.git --rev "$WCL_REV" --locked --debug --target-dir "$RUNNER_TEMP/wcl-target" wcl
          cargo install --git https://github.com/VMLabDev/vmlab.git --rev "$VMLAB_REV" --locked --debug --bin vmlab --target-dir "$RUNNER_TEMP/vmlab-target" vmlab

      - name: Check catalog, examples and docs without building guests
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/template-ci/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/template-ci/data"
          export XDG_STATE_HOME="$RUNNER_TEMP/template-ci/state"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/template-ci/run"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          just ci::check
